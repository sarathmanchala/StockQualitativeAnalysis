databases:
  - name: financial-rag-db
    databaseName: financial_research_db
    user: postgres
    plan: free

services:
  # Django REST Backend Service
  - type: web
    name: financial-rag-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: financial-rag-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: LLM_PROVIDER
        value: "gemini"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LLM_MODEL
        value: "gemini-2.5-flash"
      - key: EMBEDDING_PROVIDER
        value: "local"
      - key: MARKETPING_MCP_URL
        value: "https://mcp.marketping.in/mcp"

  # React Vite Frontend (Static Site)
  - type: web
    name: financial-rag-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
